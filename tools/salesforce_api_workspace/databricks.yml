# This is a Databricks asset bundle definition for salesforce_api.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: salesforce_api
  uuid: 6e8dc2db-c107-4343-824e-a3544e59d2fe
  engine: direct

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: python3 setup.py bdist_wheel

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
    variables:
      salesforce_conn_id: "salesforce_u2m_conn"
  prod:
    mode: production
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pravin.varma@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pravin.varma@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: pravin.varma@databricks.com
        level: CAN_MANAGE

variables:
  salesforce_conn_id:
    description: "Unity Catalog HTTP connection id for Salesforce"
    default: "salesforce_u2m_conn"
  salesforce_object:
    description: "Salesforce object for bulk write"
    default: "Account"
  salesforce_update_id_1:
    description: "Salesforce Account Id for update test row 1"
    default: "001dM00003ollErQAI"
  salesforce_update_id_2:
    description: "Salesforce Account Id for update test row 2"
    default: "001dM00003ollEsQAI"
  hightouch_conn_id:
    description: "Unity Catalog HTTP connection id for Hightouch API"
    default: "hightouch_uc2"
  hightouch_sync_id:
    description: "Hightouch sync id to monitor"
    default: "2771312"
