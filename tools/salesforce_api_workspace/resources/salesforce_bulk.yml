resources:
  jobs:
    salesforce_upsert_with_sensor:
      name: "[hackathon] Salesforce Upsert with Sensor"

      tasks:
        - task_key: upsert_accounts
          environment_key: default
          python_operator_task:
            main: salesforce_api.salesforce_upsert
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: external_id_field
                value: "Account_Number_External__c"
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "HACK001", "Name": "Hackathon Account 1", "Industry": "Technology"},
                    {"Account_Number_External__c": "HACK002", "Name": "Hackathon Account 2", "Industry": "Finance"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: wait_for_completion
                value: "false"

        - task_key: wait_for_upsert
          depends_on:
            - task_key: upsert_accounts
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceBulkJobSensor
            parameters:
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "upsert_accounts"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

    salesforce_insert_operator:
      name: "[hackathon] Salesforce Insert Operator"

      tasks:
        - task_key: insert_with_operator
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceBulkWriteOperator
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: operation
                value: "insert"
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "INS001", "Name": "Insert Operator Account A", "Industry": "Technology"},
                    {"Account_Number_External__c": "INS002", "Name": "Insert Operator Account B", "Industry": "Finance"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "insert_with_operator"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

    salesforce_update_operator:
      name: "[hackathon] Salesforce Update Operator"

      tasks:
        - task_key: update_with_operator
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceBulkWriteOperator
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: operation
                value: "update"
              - name: records
                value: |
                  [
                    {"Id": "${var.salesforce_update_id_1}", "Industry": "Manufacturing"},
                    {"Id": "${var.salesforce_update_id_2}", "Industry": "Retail"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "update_with_operator"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl
