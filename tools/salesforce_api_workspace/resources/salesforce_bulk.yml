resources:
  jobs:
    salesforce_functions_crud:
      name: "[hackathon] Salesforce Functions CRUD"

      tasks:
        - task_key: function_insert_accounts
          environment_key: default
          python_operator_task:
            main: salesforce_api.salesforce_insert
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "FUNC_INS_001", "Name": "Function Insert Account 1", "Industry": "Technology"},
                    {"Account_Number_External__c": "FUNC_INS_002", "Name": "Function Insert Account 2", "Industry": "Finance"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: wait_for_completion
                value: "true"

        - task_key: function_upsert_accounts
          depends_on:
            - task_key: function_insert_accounts
          environment_key: default
          python_operator_task:
            main: salesforce_api.salesforce_upsert
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: external_id_field
                value: "Account_Number_External__c"
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "FUNC_INS_001", "Name": "Function Upsert Updated 1", "Industry": "Healthcare"},
                    {"Account_Number_External__c": "FUNC_UPS_003", "Name": "Function Upsert New 3", "Industry": "Retail"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: wait_for_completion
                value: "true"

        - task_key: function_update_accounts
          depends_on:
            - task_key: function_upsert_accounts
          environment_key: default
          python_operator_task:
            main: salesforce_api.salesforce_update
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: records
                value: |
                  [
                    {"Id": "${var.salesforce_update_id_1}", "Industry": "Manufacturing"},
                    {"Id": "${var.salesforce_update_id_2}", "Industry": "Retail"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: wait_for_completion
                value: "true"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    salesforce_insert_operator:
      name: "[hackathon] Salesforce Insert Operator"

      tasks:
        - task_key: insert_with_operator
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceBulkWriteOperator
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: operation
                value: "insert"
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "INS800", "Name": "Insert Operator Account A", "Industry": "Technology"},
                    {"Account_Number_External__c": "INS801", "Name": "Insert Operator Account B", "Industry": "Finance"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "insert_with_operator"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    salesforce_update_operator:
      name: "[hackathon] Salesforce Update Operator"

      tasks:
        - task_key: update_with_operator
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceBulkWriteOperator
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: operation
                value: "update"
              - name: records
                value: |
                  [
                    {"Id": "${var.salesforce_update_id_1}", "Industry": "Manufacturing"},
                    {"Id": "${var.salesforce_update_id_2}", "Industry": "Retail"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "update_with_operator"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    salesforce_upsert_operator:
      name: "[hackathon] Salesforce Upsert Operator"

      tasks:
        - task_key: upsert_with_operator
          environment_key: default
          python_operator_task:
            main: salesforce_api.SalesforceUpsertOperator
            parameters:
              - name: object_name
                value: ${var.salesforce_object}
              - name: external_id_field
                value: "Account_Number_External__c"
              - name: records
                value: |
                  [
                    {"Account_Number_External__c": "FUNC_INS_001", "Name": "Operator Upsert Updated 1", "Industry": "Energy"},
                    {"Account_Number_External__c": "OPER_UPS_004", "Name": "Operator Upsert New 4", "Industry": "Media"}
                  ]
              - name: conn_id
                value: ${var.salesforce_conn_id}
              - name: task_key
                value: "upsert_with_operator"
              - name: poll_interval_minutes
                value: "1"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
